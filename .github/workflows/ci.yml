name: CI

on:
    push:
    pull_request:

jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ["3.10", "3.11", "3.12"]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint (ruff)
              run: ruff check .

            - name: Tests (pytest)
              run: pytest -q
